name: reproducibility-check

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install --no-deps -r requirements.txt && pip check
      - run: python -m unittest discover -s tests -v
      - run: python src/benchmark.py --config configs/config.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phishing-study .
      - run: mkdir -p results && docker run --rm -v "$PWD/results:/app/results" phishing-study
      - run: ls -R results
